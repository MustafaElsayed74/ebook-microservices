services:
  
  catalogdb:
    image: mongo:latest

  redisdb:
    image: redis:latest
    container_name: redisdb
    restart: always
    ports:
      - "6379:6379"

  catalog.api:
    image: ${DOCKER_REGISTRY-}catalogapi
    build:
      context: .
      dockerfile: Catalog/Catalog.Api/Dockerfile


  mongoclient: 
      image: mongoclient/mongoclient 

volumes:
  mongo_data:

  
