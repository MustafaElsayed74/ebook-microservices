services:
  
  catalogdb:
    image: mongo:latest

  redisdb:
    image: redis:latest
    container_name: redisdb
    restart: always
    ports:
      - "6379:6379"


  basket.api:
    image: ${DOCKER_REGISTRY-}basketapi
    build:
      context: .
      dockerfile: Basket/Basket.Api/Dockerfile

  catalog.api:
    image: ${DOCKER_REGISTRY-}catalogapi
    build:
      context: .
      dockerfile: Catalog/Catalog.Api/Dockerfile


volumes:
  mongo_data:

  
